@keyframes spPop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}

@keyframes spUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
@keyframes spRing{0%{transform:scale(.6);opacity:1}100%{transform:scale(4.5);opacity:0}}
@keyframes spOut{to{opacity:0;transform:scale(1.08);visibility:hidden}}
